services:
  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: voice-cloner-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice_cloner_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - voice-cloner-dev-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d voice_cloner_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: voice-cloner-redis-dev
    restart: unless-stopped
    volumes:
      - redis_dev_data:/data
    networks:
      - voice-cloner-dev-network
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server (Development)
  server-dev:
    image: voice-cloner-server:latest
    container_name: voice-cloner-server-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dev_user:dev_password@postgres-dev:5432/voice_cloner_dev
      REDIS_URL: redis://redis-dev:6379
      JWT_SECRET: dev_jwt_secret_not_for_production
      JWT_REFRESH_SECRET: dev_refresh_secret_not_for_production
      JWT_ACCESS_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      LOG_LEVEL: debug
    volumes:
      - dev_uploads:/app/uploads
    networks:
      - voice-cloner-dev-network
    ports:
      - "5001:5000"
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  dev_uploads:
    driver: local

networks:
  voice-cloner-dev-network:
    driver: bridge